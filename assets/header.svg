<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="280" rx="18" fill="url(#dots)"/>

  <text x="64" y="128" class="sans" font-size="64" font-weight="800" fill="#ffffff">Vini Correa</text>
  <text x="66" y="174" class="sans" font-size="24" font-weight="500" fill="#c4b5fd">Software engineer · distributed systems · tools I wish existed</text>
  <text x="66" y="218" class="mono" font-size="17" fill="#94a3b8">A Coruña, Spain</text>

  <g transform="translate(770,64)">
    <rect width="366" height="152" rx="12" fill="#0b1020" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="22" r="6" fill="#febc2e"/>
    <circle cx="62" cy="22" r="6" fill="#28c840"/>
    <text x="22" y="66" class="mono" font-size="16" fill="#a78bfa">$ <tspan fill="#e2e8f0">git status</tspan></text>
    <text x="22" y="94" class="mono" font-size="16" fill="#94a3b8">On branch <tspan fill="#86efac">main</tspan></text>
    <text x="22" y="122" class="mono" font-size="16" fill="#94a3b8">eventually consistent<tspan class="cursor" fill="#e2e8f0"> ▍</tspan></text>
  </g>
</svg>
